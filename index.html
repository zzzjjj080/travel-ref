<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海外旅行リファレンス</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: #f5f5f0;
    padding: 24px;
    color: #1a1a1a;
    font-size: 14px;
    line-height: 1.6;
  }
  .page { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .site-title {
    font-size: 20px;
    font-weight: 600;
    color: #1a1a1a;
    letter-spacing: .01em;
  }
  .site-sub {
    font-size: 13px;
    color: #888;
    margin-top: 4px;
  }
  h1 { font-size: 13px; font-weight: 500; color: #888; margin-bottom: 8px; letter-spacing: .04em; }
  .card { background: #fff; border: 0.5px solid #d0d0c8; border-radius: 12px; overflow: hidden; }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    text-decoration: none;
    color: inherit;
    transition: background .12s;
  }
  .menu-item:hover { background: #f9f9f7; }
  .menu-item + .menu-item { border-top: 0.5px solid #e8e8e4; }
  .menu-icon {
    font-size: 24px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f0ec;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .menu-text { flex: 1; }
  .menu-label { font-size: 15px; font-weight: 500; }
  .menu-desc { font-size: 12px; color: #888; margin-top: 2px; }
  .menu-arrow { color: #ccc; font-size: 16px; }
  .footer { font-size: 11px; color: #aaa; text-align: right; margin-top: 4px; }
</style>
</head>
<body>
<div class="page">

  <div>
    <div class="site-title">海外旅行リファレンス</div>
    <div class="site-sub">よく使う情報をまとめたリファレンス集</div>
  </div>

  <div>
    <h1>カテゴリ</h1>
    <div class="card">
      <a class="menu-item" href="cards/">
        <div class="menu-icon">💳</div>
        <div class="menu-text">
          <div class="menu-label">クレジットカード</div>
          <div class="menu-desc">使い分け・付帯保険・緊急連絡先</div>
        </div>
        <div class="menu-arrow">›</div>
      </a>
      <a class="menu-item" href="packing/">
        <div class="menu-icon">🎒</div>
        <div class="menu-text">
          <div class="menu-label">持ち物リスト</div>
          <div class="menu-desc">3.8kg・東南アジア1週間想定</div>
        </div>
        <div class="menu-arrow">›</div>
      </a>
      <a class="menu-item" href="vietnam-2026/">
        <div class="menu-icon">🇻🇳</div>
        <div class="menu-text">
          <div class="menu-label">ベトナム 2026.5</div>
          <div class="menu-desc">旅程・予約・移動・現地情報すべて</div>
        </div>
        <div class="menu-arrow">›</div>
      </a>
    </div>
  </div>

  <div class="footer">travel-ref</div>
</div>
</body>
</html>
